<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f" />
      <stop offset="50%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="1" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9" />
    </linearGradient>

    <!-- Cyan Pulse Gradient -->
    <linearGradient id="cyanPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="roadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>

    <!-- Radial Sensory Wave Animation -->
    <radialGradient id="sensorRadar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .pulse-circle {
      animation: pulseRadar 3s ease-out infinite;
      transform-origin: 1060px 180px;
    }
    .pulse-circle-2 {
      animation: pulseRadar 3s ease-out infinite 1.2s;
      transform-origin: 1060px 180px;
    }
    @keyframes pulseRadar {
      0% { r: 10; opacity: 0.9; }
      50% { opacity: 0.4; }
      100% { r: 120; opacity: 0; }
    }
    .dash-flow {
      stroke-dasharray: 8, 8;
      animation: dashMove 1.5s linear infinite;
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -32; }
    }
    .title-font {
      font-family: 'Times New Roman', Times, Georgia, serif;
      font-weight: bold;
    }
    .mono-font {
      font-family: 'Courier New', Courier, monospace;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" fill="url(#roadGrid)" rx="16" />

  <!-- Road Horizon Diagonal Construction (Bottom Graphic) -->
  <path d="M 0 360 L 460 220 L 520 220 L 1200 360 Z" fill="#10141d" opacity="0.6"/>
  <path d="M 488 220 L 280 360" stroke="#f59e0b" stroke-width="2.5" class="dash-flow" stroke-opacity="0.8"/>
  <path d="M 492 220 L 920 360" stroke="#f59e0b" stroke-width="2.5" class="dash-flow" stroke-opacity="0.8"/>

  <!-- Left Accent Traffic Striping -->
  <rect x="0" y="0" width="8" height="360" fill="#b45309" rx="4"/>
  <rect x="14" y="0" width="3" height="360" fill="#d97706" opacity="0.5"/>

  <!-- Brand Emblem Badge (Upper Left) -->
  <g transform="translate(60, 48)">
    <rect width="54" height="54" rx="14" fill="#141822" stroke="#d97706" stroke-width="1.8"/>
    <!-- Highway Converging Path -->
    <path d="M 12 42 L 23 18 L 31 18 L 42 42" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="27" y1="42" x2="27" y2="34" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="27" y1="28" x2="27" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- Radar Arc -->
    <path d="M 14 14 C 21 8 33 8 40 14" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="27" cy="18" r="3" fill="#f59e0b" stroke="#ffffff" stroke-width="1.2"/>
  </g>

  <!-- Main Titles -->
  <text x="130" y="76" fill="#f8fafc" class="title-font" font-size="38" letter-spacing="1">
    TRAXION <tspan fill="#f59e0b">AI</tspan>
  </text>
  <text x="130" y="96" fill="#94a3b8" class="title-font" font-size="14" font-style="italic">
    Real-Time Road Accident &amp; Fall Kinematics Intelligence Platform
  </text>

  <!-- Tagline & Core Innovation -->
  <text x="60" y="152" fill="#e2e8f0" class="title-font" font-size="20" font-weight="bold">
    17-Keypoint Deep Pose Estimation • Scale-Invariant Biomechanical Kinematics
  </text>
  <text x="60" y="180" fill="#cbd5e1" class="title-font" font-size="14">
    3D WebGL Digital Twin • 3-State Traffic Telemetry • Automated 108/1033 Emergency Dispatch Gateway
  </text>

  <!-- Feature Pills -->
  <g transform="translate(60, 215)">
    <!-- Pill 1: Recall -->
    <rect x="0" y="0" width="165" height="34" rx="8" fill="#141822" stroke="#22c55e" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="5" fill="#22c55e"/>
    <text x="32" y="22" fill="#f8fafc" class="mono-font" font-size="12" font-weight="bold">99.4% Recall</text>

    <!-- Pill 2: Precision -->
    <rect x="180" y="0" width="175" height="34" rx="8" fill="#141822" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="198" cy="17" r="5" fill="#3b82f6"/>
    <text x="212" y="22" fill="#f8fafc" class="mono-font" font-size="12" font-weight="bold">98.8% Precision</text>

    <!-- Pill 3: Edge Latency -->
    <rect x="370" y="0" width="180" height="34" rx="8" fill="#141822" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="388" cy="17" r="5" fill="#f59e0b"/>
    <text x="402" y="22" fill="#f8fafc" class="mono-font" font-size="12" font-weight="bold">34.2ms CPU Edge</text>

    <!-- Pill 4: Zero GPU Lock-in -->
    <rect x="565" y="0" width="185" height="34" rx="8" fill="#141822" stroke="#a855f7" stroke-width="1.2"/>
    <circle cx="583" cy="17" r="5" fill="#a855f7"/>
    <text x="597" y="22" fill="#f8fafc" class="mono-font" font-size="12" font-weight="bold">80,000+ CCTVs RSU</text>
  </g>

  <!-- Target Deployments Subtitle -->
  <g transform="translate(60, 285)">
    <text x="0" y="0" fill="#f59e0b" class="mono-font" font-size="12" font-weight="bold">
      OFFICIAL CHALLENGE TRACKS &amp; GOV INTEGRATION:
    </text>
    <text x="0" y="22" fill="#94a3b8" class="title-font" font-size="13">
      Gujarat Police SENTINEL Hackathon 2026 (Model 2/5) • MoRTH / NHAI 1033 Expressway Patrol • 108 Emergency Ambulance
    </text>
  </g>

  <!-- Right Visual Radar Sensory Beacon Graphic -->
  <g transform="translate(0, 0)">
    <!-- Animated Radar Pulse Rings -->
    <circle cx="1060" cy="180" r="20" fill="none" stroke="#f59e0b" stroke-width="2" class="pulse-circle" stroke-opacity="0.8"/>
    <circle cx="1060" cy="180" r="50" fill="none" stroke="#d97706" stroke-width="1.5" class="pulse-circle-2" stroke-opacity="0.6"/>
    
    <!-- Static Radar Circles -->
    <circle cx="1060" cy="180" r="100" fill="none" stroke="#2a3242" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="1060" cy="180" r="60" fill="none" stroke="#2a3242" stroke-width="1"/>
    <circle cx="1060" cy="180" r="25" fill="#141822" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Radar Crosshairs -->
    <line x1="940" y1="180" x2="1180" y2="180" stroke="#2a3242" stroke-width="1"/>
    <line x1="1060" y1="60" x2="1060" y2="300" stroke="#2a3242" stroke-width="1"/>

    <!-- Traffic Light 3-State Mini Indicator -->
    <g transform="translate(1035, 120)">
      <rect width="50" height="120" rx="25" fill="#090b10" stroke="#2a3242" stroke-width="2"/>
      <!-- Red Lamp -->
      <circle cx="25" cy="25" r="13" fill="#dc2626"/>
      <!-- Amber Lamp -->
      <circle cx="25" cy="60" r="13" fill="#d97706" opacity="0.4"/>
      <!-- Green Lamp -->
      <circle cx="25" cy="95" r="13" fill="#16a34a" opacity="0.4"/>
    </g>
  </g>
</svg>
